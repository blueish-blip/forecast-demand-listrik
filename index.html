<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Peramalan Energi</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        canvas: '#0F1115',
                        surface: '#161920',
                        hairline: '#262A34',
                        periwinkle: '#A5B4FC',
                        mint: '#86EFAC',
                        peach: '#FDA4AF',
                        lavender: '#D8B4FE',
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0F1115; color: #F1F5F9; font-variant-numeric: tabular-nums; }
        .card { background-color: #161920; border: 1px solid #262A34; }
        .tabular { font-family: 'JetBrains Mono', monospace; }
    </style>
</head>
<body class="p-8 max-w-7xl mx-auto">

    <!-- Header -->
    <header class="flex justify-between items-end pb-8 border-b border-hairline mb-8">
        <div>
            <h1 class="text-2xl font-semibold tracking-tight">Dashboard Peramalan Permintaan Energi</h1>
            <p class="text-slate-400 text-sm mt-1">Evaluasi dan proyeksi 30 hari ke depan (SARIMAX & Prophet)</p>
            <p class="text-[10px] uppercase tracking-wider text-slate-500 mt-2">Last Updated: 2026-11-20</p>
        </div>
        <div class="flex gap-4">
            <select class="bg-surface border border-hairline px-3 py-1.5 text-sm rounded-md focus:outline-none">
                <option>SARIMAX</option>
                <option>Prophet</option>
                <option>Bandingkan Semua</option>
            </select>
            <button class="border border-hairline px-4 py-1.5 text-sm rounded-md hover:bg-hairline transition">Export CSV</button>
        </div>
    </header>

    <!-- KPI Grid -->
    <section class="grid grid-cols-4 gap-4 mb-8">
        <div class="card p-4">
            <div class="text-[10px] uppercase tracking-wider text-slate-500 mb-2">RMSE</div>
            <div class="text-2xl tabular">12.42</div>
        </div>
        <div class="card p-4">
            <div class="text-[10px] uppercase tracking-wider text-slate-500 mb-2">MAE</div>
            <div class="text-2xl tabular">9.10</div>
        </div>
        <div class="card p-4">
            <div class="text-[10px] uppercase tracking-wider text-slate-500 mb-2">MAPE</div>
            <div class="text-2xl tabular">3.2%</div>
        </div>
        <div class="card p-4 relative">
            <div class="text-[10px] uppercase tracking-wider text-slate-500 mb-2">AIC</div>
            <div class="text-2xl tabular">450.2</div>
            <span class="absolute top-4 right-4 bg-mint/10 text-mint text-[10px] font-bold px-2 py-0.5 rounded border border-mint/20">BEST</span>
        </div>
    </section>

    <!-- Main Plot -->
    <section class="card p-6 mb-8">
        <div id="mainPlot" style="width:100%; height:400px;"></div>
    </section>

    <!-- Secondary Analysis -->
    <section class="grid grid-cols-[45%,55%] gap-8">
        <div class="card p-6">
            <h2 class="text-sm font-semibold mb-6">Analisis Residual</h2>
            <div id="residualPlot" style="width:100%; height:250px;"></div>
        </div>
        <div class="card p-6 overflow-x-auto">
            <h2 class="text-sm font-semibold mb-4">Proyeksi Hasil</h2>
            <table class="w-full text-sm text-left">
                <thead class="text-slate-500 border-b border-hairline">
                    <tr>
                        <th class="py-2">Tanggal</th>
                        <th class="py-2">Aktual</th>
                        <th class="py-2">Prediksi</th>
                        <th class="py-2">95% CI</th>
                    </tr>
                </thead>
                <tbody class="font-mono text-xs">
                    <tr class="border-b border-hairline/50">
                        <td class="py-3">2026-11-21</td>
                        <td>120.5</td>
                        <td>119.8</td>
                        <td>112.0 - 127.6</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>

    <script>
        const layout = {
            paper_bgcolor: 'rgba(0,0,0,0)',
            plot_bgcolor: 'rgba(0,0,0,0)',
            margin: { t: 20, r: 20, l: 40, b: 40 },
            showlegend: true,
            legend: { orientation: 'h', y: 1.1, font: { color: '#94A3B8' } },
            xaxis: { gridcolor: '#1E222B', tickfont: { color: '#94A3B8' } },
            yaxis: { gridcolor: '#1E222B', tickfont: { color: '#94A3B8' } }
        };

        // Main Plot
        const traceActual = { x: ['2026-11-01', '2026-11-10', '2026-11-20'], y: [120, 125, 118], name: 'Aktual', line: { color: '#E2E8F0', width: 2 } };
        const traceForecast = { x: ['2026-11-20', '2026-11-30'], y: [118, 122], name: 'Forecast', line: { color: '#A5B4FC', dash: 'dash' } };
        Plotly.newPlot('mainPlot', [traceActual, traceForecast], layout);

        // Residual Plot
        const traceResidual = { x: [1, 2, 3], y: [0.5, -0.2, 0.8], type: 'bar', marker: { color: '#FDA4AF' } };
        Plotly.newPlot('residualPlot', [traceResidual], { ...layout, showlegend: false });
    </script>
</body>
</html>
